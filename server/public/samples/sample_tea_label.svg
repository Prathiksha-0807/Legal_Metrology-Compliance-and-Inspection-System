<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="600" height="680">
  <defs>
    <linearGradient id="teaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Package Background -->
  <rect width="600" height="680" rx="16" fill="#fcfbf7" stroke="#d6d3d1" stroke-width="2"/>
  
  <!-- Header Banner -->
  <rect x="0" y="0" width="600" height="140" rx="16" fill="url(#teaGrad)"/>
  <rect x="0" y="120" width="600" height="20" fill="url(#teaGrad)"/>
  
  <!-- Brand & Commodity Name -->
  <text x="300" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="2">GOLDEN LEAF</text>
  <text x="300" y="85" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">PREMIUM CTC BLACK TEA</text>
  <text x="300" y="112" font-family="Arial, sans-serif" font-size="13" fill="#bbf7d0" text-anchor="middle">गोल्डन लीफ प्रीमियम सी.टी.सी. चाय</text>

  <!-- Principal Display Panel Badge -->
  <rect x="440" y="155" width="130" height="24" rx="4" fill="#e2e8f0"/>
  <text x="505" y="171" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle">PDP PANEL</text>

  <!-- Quality Badges -->
  <rect x="60" y="160" width="120" height="60" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="120" y="186" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">100% PURE TEA</text>
  <text x="120" y="204" font-family="Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle">Rich Aroma &amp; Color</text>

  <!-- FSSAI Emblem Area -->
  <rect x="200" y="160" width="160" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="280" y="185" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">fssai</text>
  <text x="280" y="204" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Lic No: 10019011005678</text>

  <!-- Mandatory Declarations Box -->
  <rect x="40" y="245" width="520" height="380" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="40" y="245" width="520" height="28" fill="#0f172a" rx="8"/>
  <rect x="40" y="265" width="520" height="8" fill="#0f172a"/>
  <text x="300" y="264" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle" letter-spacing="1">MANDATORY DECLARATIONS (PACKAGED COMMODITIES RULES, 2011)</text>

  <!-- Field 1: Net Quantity -->
  <g id="box-net-qty">
    <rect x="60" y="285" width="230" height="42" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="75" y="312" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0f172a">Net Qty: 250 g</text>
  </g>

  <!-- Field 2: MRP -->
  <g id="box-mrp">
    <rect x="60" y="340" width="480" height="42" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="75" y="367" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">MRP ₹ 145.00 <tspan font-size="13" font-weight="normal" fill="#475569">(inclusive of all taxes)</tspan></text>
  </g>

  <!-- Field 3: Date of Packing -->
  <g id="box-mfg-date">
    <rect x="60" y="395" width="230" height="36" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="75" y="419" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155">Pkd Date: 02/2026</text>
  </g>
  <text x="320" y="419" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Batch No: APX-TEA-26B</text>

  <!-- Field 4: Manufacturer / Packer -->
  <g id="box-manufacturer">
    <rect x="60" y="445" width="480" height="68" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="75" y="468" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Manufactured &amp; Packed by:</text>
    <text x="75" y="487" font-family="Arial, sans-serif" font-size="12" fill="#334155">Apex Beverages India Pvt. Ltd., Plot No. 44, Okhla Industrial</text>
    <text x="75" y="504" font-family="Arial, sans-serif" font-size="12" fill="#334155">Area, Phase III, New Delhi 110020, India.</text>
  </g>

  <!-- Field 5: Consumer Care -->
  <g id="box-consumer-care">
    <rect x="60" y="525" width="480" height="70" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="75" y="547" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Consumer Care Redressal Cell:</text>
    <text x="75" y="565" font-family="Arial, sans-serif" font-size="11" fill="#334155">Executive, Plot 44 Okhla, New Delhi. Tel: 1800-11-4433</text>
    <text x="75" y="582" font-family="Arial, sans-serif" font-size="11" fill="#2563eb">Email: customercare@apextea.in</text>
  </g>

  <!-- Barcode footer -->
  <rect x="370" y="605" width="170" height="15" fill="#334155"/>
  <text x="455" y="618" font-family="monospace" font-size="9" fill="#ffffff" text-anchor="middle">8 901234 567890</text>
</svg>
