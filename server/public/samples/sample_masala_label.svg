<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="600" height="680">
  <defs>
    <linearGradient id="spiceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <rect width="600" height="680" rx="16" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/>
  <rect x="0" y="0" width="600" height="140" rx="16" fill="url(#spiceGrad)"/>
  <rect x="0" y="120" width="600" height="20" fill="url(#spiceGrad)"/>

  <text x="300" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="2">ROYAL SHAHI</text>
  <text x="300" y="85" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">GARAM MASALA (BLENDED SPICE)</text>
  <text x="300" y="112" font-family="Arial, sans-serif" font-size="13" fill="#fecdd3" text-anchor="middle">शाही गरम मसाला</text>

  <rect x="440" y="155" width="130" height="24" rx="4" fill="#e2e8f0"/>
  <text x="505" y="171" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle">BACK PANEL</text>

  <rect x="40" y="245" width="520" height="380" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="40" y="245" width="520" height="28" fill="#881337" rx="8"/>
  <rect x="40" y="265" width="520" height="8" fill="#881337"/>
  <text x="300" y="264" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffe4e6" text-anchor="middle" letter-spacing="1">PACKAGING DECLARATIONS</text>

  <!-- Net Quantity (VIOLATION: "approx 200g" violates Rule 12(6)) -->
  <g id="box-net-qty">
    <rect x="60" y="285" width="260" height="42" rx="4" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="75" y="312" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#be123c">Net Wt: approx 200g</text>
  </g>

  <!-- MRP -->
  <g id="box-mrp">
    <rect x="60" y="340" width="480" height="42" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="75" y="367" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">MRP ₹ 110.00 <tspan font-size="13" font-weight="normal" fill="#475569">(incl. of all taxes)</tspan></text>
  </g>

  <!-- Date -->
  <g id="box-mfg-date">
    <rect x="60" y="395" width="200" height="36" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="75" y="419" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155">Pkd: 03/2026</text>
  </g>

  <!-- Manufacturer -->
  <g id="box-manufacturer">
    <rect x="60" y="445" width="480" height="68" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="75" y="468" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Packed by:</text>
    <text x="75" y="487" font-family="Arial, sans-serif" font-size="12" fill="#334155">Royal Spice Mills, Khari Baoli, Old Delhi 110006.</text>
  </g>

  <!-- Consumer Care (VIOLATION: missing email address) -->
  <g id="box-consumer-care">
    <rect x="60" y="525" width="480" height="70" rx="4" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="75" y="547" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#be123c">Customer Helpline: 011-23998877</text>
    <text x="75" y="568" font-family="Arial, sans-serif" font-size="11" fill="#881337">(No email or postal redressal address specified)</text>
  </g>
</svg>
