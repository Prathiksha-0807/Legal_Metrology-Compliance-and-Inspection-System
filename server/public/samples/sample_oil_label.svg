<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="600" height="680">
  <defs>
    <linearGradient id="oilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
  </defs>

  <rect width="600" height="680" rx="16" fill="#fefce8" stroke="#facc15" stroke-width="2"/>
  <rect x="0" y="0" width="600" height="140" rx="16" fill="url(#oilGrad)"/>
  <rect x="0" y="120" width="600" height="20" fill="url(#oilGrad)"/>

  <text x="300" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">PUREDROP</text>
  <text x="300" y="85" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fef08a" text-anchor="middle">KACHI GHANI MUSTARD OIL</text>
  <text x="300" y="112" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">शुद्ध कच्ची घानी सरसों का तेल</text>

  <rect x="440" y="155" width="130" height="24" rx="4" fill="#e2e8f0"/>
  <text x="505" y="171" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle">FRONT PANEL</text>

  <!-- Notice of violation points visually -->
  <rect x="40" y="245" width="520" height="380" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="40" y="245" width="520" height="28" fill="#451a03" rx="8"/>
  <rect x="40" y="265" width="520" height="8" fill="#451a03"/>
  <text x="300" y="264" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fef3c7" text-anchor="middle" letter-spacing="1">STATUTORY PRODUCT DECLARATIONS</text>

  <!-- Net Quantity (VIOLATION: 1000 ml instead of 1 L) -->
  <g id="box-net-qty">
    <rect x="60" y="285" width="230" height="42" rx="4" fill="#fffbeb" stroke="#fde68a"/>
    <text x="75" y="312" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#92400e">Net Vol: 1000 ml</text>
  </g>

  <!-- MRP (VIOLATION: Missing "inclusive of all taxes") -->
  <g id="box-mrp">
    <rect x="60" y="340" width="320" height="42" rx="4" fill="#fffbeb" stroke="#fde68a"/>
    <text x="75" y="367" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#78350f">MRP Rs. 185.00</text>
  </g>

  <!-- Date -->
  <g id="box-mfg-date">
    <rect x="60" y="395" width="230" height="36" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="75" y="419" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155">Mfg Date: 01/2026</text>
  </g>

  <!-- Manufacturer -->
  <g id="box-manufacturer">
    <rect x="60" y="445" width="480" height="68" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="75" y="468" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Mfg by:</text>
    <text x="75" y="487" font-family="Arial, sans-serif" font-size="12" fill="#334155">PureDrop Agro Foods Ltd., G.T. Road, Karnal,</text>
    <text x="75" y="504" font-family="Arial, sans-serif" font-size="12" fill="#334155">Haryana 132001, India.</text>
  </g>

  <!-- Consumer Care -->
  <g id="box-consumer-care">
    <rect x="60" y="525" width="480" height="70" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="75" y="547" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Customer Care:</text>
    <text x="75" y="565" font-family="Arial, sans-serif" font-size="11" fill="#334155">Manager, PureDrop Agro, Karnal. Phone: 0184-225588</text>
    <text x="75" y="582" font-family="Arial, sans-serif" font-size="11" fill="#2563eb">Email: care@puredropoil.com</text>
  </g>
</svg>
